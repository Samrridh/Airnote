<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AirQuiz - Capital Guess</title>
  <script defer src="{{ url_for('static', filename='script.js') }}"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-blue-100 min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md text-center">
    <h1 class="text-2xl font-bold mb-4 text-gray-800">✈️ AirQuiz</h1>
    <button id="startBtn" class="bg-indigo-500 text-white px-4 py-2 rounded hover:bg-indigo-600 mb-4">Start Quiz</button>

    <div id="status" class="text-sm text-left space-y-1 text-gray-700 mb-4"></div>

    <div id="quiz" class="hidden">
      <p class="mb-2">What is the capital of <span id="countryName" class="font-semibold text-indigo-600"></span>?</p>
      <input id="answerInput" type="text" class="w-full border px-3 py-2 rounded mb-2">
      <button id="submitBtn" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">Submit</button>
      <p id="result" class="mt-3 font-semibold"></p>
    </div>
  </div>
</body>
</html>
